services:
  qdrant:
    # Pin to match qdrant-client in the venv (minor drift ≤ 1). Avoid floating :latest.
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
