# Production layout: chat API + inbox worker + Qdrant.
# LLM stays out of this file (cloud API key, or llama-server / Ollama on the host).
#
#   cp .env.example .env
#   docker compose up -d --build
#   # drop PDFs into ./incoming — the worker archives them after ingest
#
# Optional LangExtract via Ollama in Compose:
#   docker compose --profile extract up -d
#   # and set OLLAMA_BASE_URL=http://ollama:11434 in .env
#
# Client air-gap image (embeddings baked in):
#   PREFETCH_EMBED=1 docker compose build

x-app-env: &app-env
  QDRANT_URL: http://qdrant:6333
  DATA_DIR: /data
  INCOMING_DIR: /incoming
  ARCHIVE_DIR: /data/archive
  FAILED_DIR: /data/failed
  CHAT_API_HOST: 0.0.0.0
  CHAT_API_PORT: "8000"
  CHAT_CHECKPOINT_DB: /data/chat_checkpoints.sqlite

x-app: &app
  image: rag-ingestion:local
  build:
    context: .
    dockerfile: Dockerfile
    args:
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-large}
      PREFETCH_EMBED: ${PREFETCH_EMBED:-0}
  env_file:
    - path: .env
      required: false
  environment:
    <<: *app-env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./data:/data
    - ./incoming:/incoming
    - ./config:/app/config:ro
  depends_on:
    - qdrant
  restart: unless-stopped

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

  chat:
    <<: *app
    ports:
      - "${CHAT_API_PORT:-8000}:8000"
    command: ["rag-chat", "serve", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    <<: *app
    command: ["rag-ingest", "watch"]

  ollama:
    profiles: ["extract"]
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  qdrant_storage:
  ollama_data:
