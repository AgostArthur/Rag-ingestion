# Network `enviro-rag`.
#   web            — UI (nginx) on :3000
#   chat-api       — chat + catalog HTTP API on :8000
#   ingest-worker  — watches ./incoming and ingests PDFs
#   vector-store   — Qdrant chunk index on :6333
#   extract-llm    — optional Ollama (profile `extract`) on :11434
#
# LLM for chat stays outside this file unless you enable `extract`:
# set LLM_PROVIDER in `.env` (local / ollama / openai / gemini).
#
#   cp .env.example .env
#   docker compose up -d --build
#   # UI: http://localhost:3000  — drop PDFs into ./incoming
#   # First build downloads EMBED_MODEL (FastEmbed). PREFETCH_EMBED=0 to skip.
#
# Optional LangExtract via the in-network LLM:
#   docker compose --profile extract up -d
#   # and set OLLAMA_BASE_URL=http://extract-llm:11434 in .env

x-app-env: &app-env
  QDRANT_URL: http://vector-store:6333
  DATA_DIR: /data
  INCOMING_DIR: /incoming
  ARCHIVE_DIR: /data/archive
  FAILED_DIR: /data/failed
  # Journal d'ingest (même fichier que le CLI local via volume ./data:/data)
  INGEST_LOG_FILE: /data/log_ingest.jsonl
  CHAT_API_HOST: 0.0.0.0
  CHAT_API_PORT: "8000"
  CHAT_CHECKPOINT_DB: /data/chat_checkpoints.sqlite
  # LLM : `.env` (`LLM_PROVIDER`). localhost y est réécrit vers host.docker.internal.

x-app: &app
  image: rag-ingestion:local
  build:
    context: .
    dockerfile: Dockerfile
    args:
      EMBED_MODEL: ${EMBED_MODEL:-sentence-transformers/paraphrase-multilingual-mpnet-base-v2}
      PREFETCH_EMBED: ${PREFETCH_EMBED:-1}
  env_file:
    - path: .env
      required: false
  environment:
    <<: *app-env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./data:/data
    - ./incoming:/incoming
    - ./config:/app/config:ro
    # Code Python du dépôt (sans rebuild FastEmbed). TIMELINE_ROLES / API suivent src/.
    - ./src:/app/src:ro
  depends_on:
    - vector-store
  restart: unless-stopped

services:
  vector-store:
    container_name: enviro-rag-vector-store
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

  chat-api:
    <<: *app
    container_name: enviro-rag-chat-api
    ports:
      - "${CHAT_API_PORT:-8000}:8000"
    command: ["rag-chat", "serve", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  ingest-worker:
    <<: *app
    container_name: enviro-rag-ingest-worker
    command: ["rag-ingest", "watch"]

  web:
    container_name: enviro-rag-web
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "${UI_PORT:-3000}:80"
    depends_on:
      chat-api:
        condition: service_healthy
    restart: unless-stopped

  extract-llm:
    profiles: ["extract"]
    container_name: enviro-rag-extract-llm
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

networks:
  default:
    name: enviro-rag

volumes:
  qdrant_storage:
  ollama_data:
