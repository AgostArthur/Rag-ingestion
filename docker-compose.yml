# Production: UI + chat API + inbox worker + Qdrant.
# LLM stays out of this file: set LLM_PROVIDER in `.env` (local / ollama / openai / gemini).
#
#   cp .env.example .env
#   docker compose up -d --build
#   # UI: http://localhost:3000  — drop PDFs into ./incoming
#
# Optional LangExtract via Ollama in Compose:
#   docker compose --profile extract up -d
#   # and set OLLAMA_BASE_URL=http://ollama:11434 in .env
#
# Client air-gap image (embeddings baked in):
#   PREFETCH_EMBED=1 docker compose build

x-app-env: &app-env
  QDRANT_URL: http://qdrant:6333
  DATA_DIR: /data
  INCOMING_DIR: /incoming
  ARCHIVE_DIR: /data/archive
  FAILED_DIR: /data/failed
  CHAT_API_HOST: 0.0.0.0
  CHAT_API_PORT: "8000"
  CHAT_CHECKPOINT_DB: /data/chat_checkpoints.sqlite
  # LLM : `.env` (`LLM_PROVIDER`). localhost y est réécrit vers host.docker.internal.

x-app: &app
  image: rag-ingestion:local
  build:
    context: .
    dockerfile: Dockerfile
    args:
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-large}
      PREFETCH_EMBED: ${PREFETCH_EMBED:-0}
  env_file:
    - path: .env
      required: false
  environment:
    <<: *app-env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./data:/data
    - ./incoming:/incoming
    - ./config:/app/config:ro
  depends_on:
    - qdrant
  restart: unless-stopped

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

  chat:
    <<: *app
    ports:
      - "${CHAT_API_PORT:-8000}:8000"
    command: ["rag-chat", "serve", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  worker:
    <<: *app
    command: ["rag-ingest", "watch"]

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
    ports:
      - "${UI_PORT:-3000}:80"
    depends_on:
      chat:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    profiles: ["extract"]
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  qdrant_storage:
  ollama_data:
