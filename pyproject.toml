[project]
name = "rag-ingestion"
version = "0.1.0"
description = "Ingestion RAG locale : LiteParse → chunks → LangExtract + embeddings → Qdrant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.12.0",
    "python-dotenv>=1.0.0",
    "fastembed>=0.5.1",
    "liteparse>=2.1.0",
    "langextract>=1.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
chat = [
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
rag-ingest = "rag_ingestion.cli:main"
rag-chat = "chatbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ingestion", "src/chatbot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
